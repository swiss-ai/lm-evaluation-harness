task: medxpertqa_cot
dataset_path: TsinghuaC3I/MedXpertQA
dataset_name: Text
output_type: generate_until
fewshot_split: dev
test_split: test
doc_to_text: !function utils.doc_to_text_cot
doc_to_target: label
generation_kwargs:
  until: []
  do_sample: false
  temperature: 0.0
  max_gen_toks: 512
filter_list:
  - name: "regex-extractor"
    filter:
      - function: "regex"
        # the last "Final Answer: X" (X = A-J, optionally bold or in parentheses)
        regex_pattern: "Final Answer:\\s*(?:\\*\\*)?\\s*\\(?([A-J])\\)?(?![A-Za-z])"
        group_select: -1
      - function: "take_first"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
repeat_support:
  exact_match: binary
