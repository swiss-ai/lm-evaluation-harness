task: msafetemp_hb_asr
include: _msafetemp_hb_yaml
process_docs: !function utils.hb_asr_docs
process_results: !function metrics.process_harmful
metric_list:
  - metric: asr
    aggregation: !function metrics.macro_rate
    higher_is_better: false
  - metric: asr_pooled
    aggregation: !function metrics.pooled_rate
    higher_is_better: false
  - metric: valid
    aggregation: !function metrics.valid_share
    higher_is_better: true
