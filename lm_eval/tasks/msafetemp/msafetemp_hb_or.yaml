task: msafetemp_hb_or
include: _msafetemp_hb_yaml
process_docs: !function utils.hb_or_docs
process_results: !function metrics.process_benign
metric_list:
  - metric: or
    aggregation: !function metrics.macro_rate
    higher_is_better: false
  - metric: or_pooled
