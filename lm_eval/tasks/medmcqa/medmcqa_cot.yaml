task: medmcqa_cot
dataset_path: openlifescienceai/medmcqa
output_type: generate_until
training_split: train
validation_split: validation
test_split: validation
doc_to_text: !function utils_medmcqa.doc_to_text_cot
doc_to_target: !function utils_medmcqa.doc_to_target_cot
generation_kwargs:
  until: []
  do_sample: false
  temperature: 0.0
  max_gen_toks: 512
filter_list:
  - name: "regex-extractor"
    filter:
      - function: "regex"
        regex_pattern: "Final Answer:\\s*(?:\\*\\*)?\\s*\\(?([A-D])\\)?(?![A-Za-z])"
        group_select: -1
      - function: "take_first"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
repeat_support:
  exact_match: binary
